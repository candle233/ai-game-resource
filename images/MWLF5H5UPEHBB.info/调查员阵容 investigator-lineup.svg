<svg viewBox="0 0 1200 340" role="img" aria-labelledby="crewTitle crewDesc">
            <title id="crewTitle">五位调查员剪影概念图</title>
            <desc id="crewDesc">五个深色人物剪影并排站在雾中的海滩上，背后是一轮低垂的苍白月亮。从左到右依次是戴大檐舰长帽的舰长、戴兜帽持杖的学者、戴宽檐帽背霰弹枪的猎人、披短斗篷提灯的医师、戴焊接面罩背设备的工程师。</desc>
