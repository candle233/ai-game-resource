              </radialGradient>
              <linearGradient id="crewFog" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#8fa9a4" stop-opacity="0"/><stop offset="100%" stop-color="#8fa9a4" stop-opacity=".26"/>
              </linearGradient>
            </defs>
