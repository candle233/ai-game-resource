<svg viewBox="0 40 800 600" role="img" aria-labelledby="mapTitle mapDesc">
            <title id="mapTitle">无昼岛区域结构示意图</title>
            <desc id="mapDesc">手绘风格的岛屿俯视示意图：中央为滩头营地，沿海分布潮汐浅滩与沉船湾，内陆有黑帆营地、失落神庙，东南角为灯塔与深渊裂口。六个编号标记对应六个可探索区域。</desc>
            <defs>
              <radialGradient id="mapSea" cx="50%" cy="45%" r="72%">
                <stop offset="0" stop-color="#0e2429"/><stop offset="100%" stop-color="#061014"/>
              </radialGradient>
              <linearGradient id="landG" x1="0" y1="0" x2="0.4" y2="1">
                <stop offset="0" stop-color="#173034"/><stop offset="50%" stop-color="#12282c"/><stop offset="100%" stop-color="#0d1f23"/>
              </linearGradient>
              <radialGradient id="riftG" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="#b06a4a" stop-opacity=".55"/>
                <stop offset="100%" stop-color="#b06a4a" stop-opacity="0"/>
              </radialGradient>
              <pattern id="hatch" width="8" height="8" patternTransform="rotate(38)" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="0" y2="8" stroke="#6fb8af" stroke-opacity=".10" stroke-width="1"/>
              </pattern>
            </defs>
            <rect width="800" height="640" fill="url(#mapSea)"/>
            <g stroke="#6fb8af" stroke-opacity=".07" fill="none">
              <path d="M0 60h800M0 140h800M0 220h800M0 300h800M0 380h800M0 460h800M0 540h800"/>
              <path d="M60 0v640M160 0v640M260 0v640M360 0v640M460 0v640M560 0v640M660 0v640M760 0v640"/>
            </g>
            <!-- bathymetric rings -->
            <g fill="none" stroke="#4f8a86" stroke-opacity=".22">
              <path d="M96 330 C110 214 196 128 314 108 C438 86 560 118 646 190 C728 258 744 372 700 452 C650 542 528 578 402 566 C268 554 168 500 122 416 C102 380 92 356 96 330Z"/>
              <path d="M132 332 C146 234 220 158 326 140 C436 120 546 148 622 212 C694 272 708 368 668 438 C624 516 518 546 404 536 C286 526 198 478 156 404 C138 372 130 350 132 332Z" stroke-opacity=".16"/>
            </g>
            <!-- island -->
            <path d="M150 338 C158 262 204 208 276 184 C336 164 384 178 426 158 C470 138 512 152 540 186 C572 224 556 258 590 288 C622 316 636 360 608 400 C580 440 590 472 548 498 C508 522 462 512 420 526 C372 542 330 524 296 492 C258 456 214 452 186 414 C162 382 146 362 150 338Z" fill="url(#landG)" stroke="#4f7d70" stroke-opacity=".55" stroke-width="2"/>
            <path d="M150 338 C158 262 204 208 276 184 C336 164 384 178 426 158 C470 138 512 152 540 186 C572 224 556 258 590 288 C622 316 636 360 608 400 C580 440 590 472 548 498 C508 522 462 512 420 526 C372 542 330 524 296 492 C258 456 214 452 186 414 C162 382 146 362 150 338Z" fill="none" stroke="#9ac7b4" stroke-opacity=".13" stroke-width="7"/>
            <path d="M150 338 C158 262 204 208 276 184 C336 164 384 178 426 158 C470 138 512 152 540 186 C572 224 556 258 590 288 C622 316 636 360 608 400 C580 440 590 472 548 498 C508 522 462 512 420 526 C372 542 330 524 296 492 C258 456 214 452 186 414 C162 382 146 362 150 338Z" fill="url(#hatch)"/>
            <!-- terrain contours -->
            <g fill="none" stroke="#5c8b6f" stroke-opacity=".28">
              <path d="M258 328 C286 296 330 292 356 316 C382 340 366 374 332 384 C294 394 262 366 258 328Z"/>
              <path d="M300 344 C314 330 336 330 346 344 C356 358 344 372 328 374 C310 376 296 360 300 344Z"/>
            </g>
            <!-- temple plateau -->
            <g fill="#1b3a34" stroke="#7fa06a" stroke-opacity=".35">
              <path d="M396 232 L470 220 L486 262 L418 278 Z"/>
              <path d="M404 240 L462 231"/>
            </g>
            <!-- paths -->
            <g stroke="#d8a94a" stroke-opacity=".38" stroke-width="1.4" stroke-dasharray="5 5" fill="none">
              <path d="M352 452 C338 412 372 362 400 330 C414 314 422 292 434 274"/>
              <path d="M352 452 C410 430 452 372 480 316 C494 286 506 236 516 204"/>
              <path d="M352 452 C318 462 292 464 268 466"/>
              <path d="M352 452 C420 470 500 452 560 410 C590 388 612 368 634 352"/>
            </g>
            <!-- rift glow -->
            <ellipse cx="586" cy="470" rx="74" ry="54" fill="url(#riftG)"/>
            <g stroke="#c98058" stroke-opacity=".6" fill="none" stroke-width="1.4">
              <path d="M556 448 l18 14 l-8 18 l22 10"/>
              <path d="M596 442 l-6 22 l16 8 l-4 20"/>
              <path d="M578 500 l14 6"/>
            </g>
            <!-- lighthouse icon -->
            <g>
              <path d="M668 330 l4 -34 l8 0 l4 34 z" fill="#132b2c" stroke="#d8c07a" stroke-opacity=".55"/>
              <circle cx="676" cy="294" r="3.2" fill="#ffe2a0"/>
              <path d="M676 294 L760 260 L760 330 Z" fill="#efe6c6" opacity=".12"/>
              <path d="M676 294 L596 330 L600 372 Z" fill="#efe6c6" opacity=".07"/>
            </g>
            <!-- wreck icons -->
            <g fill="#0a1a1d" stroke="#3f6462" stroke-opacity=".6">
              <path d="M214 250 l34 0 l-6 12 l-22 0 z"/>
              <path d="M230 250 l0 -20 l14 6 l-4 14 z"/>
              <path d="M560 246 l30 0 l-5 11 l-20 0 z"/>
              <path d="M574 246 l0 -18 l12 5 l-3 13 z"/>
            </g>
            <!-- region nodes -->
            <g>
              <g class="node">
                <circle cx="352" cy="452" r="30" fill="#0d1f23" stroke="#dcae55" stroke-opacity=".8"/>
                <circle cx="352" cy="452" r="38" fill="none" stroke="#dcae55" stroke-opacity=".2"/>
                <text x="352" y="461" text-anchor="middle" font-size="24" fill="#ffdf9c" font-family="Georgia,serif">1</text>
              </g>
              <circle cx="268" cy="466" r="26" fill="#0d1f23" stroke="#6fb8af" stroke-opacity=".75"/>
              <text x="268" y="474" text-anchor="middle" font-size="21" fill="#a9ded6" font-family="Georgia,serif">2</text>
              <circle cx="222" cy="300" r="26" fill="#0d1f23" stroke="#6fb8af" stroke-opacity=".75"/>
              <text x="222" y="308" text-anchor="middle" font-size="21" fill="#a9ded6" font-family="Georgia,serif">3</text>
              <circle cx="526" cy="204" r="26" fill="#0d1f23" stroke="#c95d43" stroke-opacity=".75"/>
              <text x="526" y="212" text-anchor="middle" font-size="21" fill="#ffbfa4" font-family="Georgia,serif">4</text>
              <circle cx="438" cy="290" r="26" fill="#0d1f23" stroke="#a892d4" stroke-opacity=".75"/>
              <text x="438" y="298" text-anchor="middle" font-size="21" fill="#cbb9ec" font-family="Georgia,serif">5</text>
              <circle cx="642" cy="352" r="26" fill="#0d1f23" stroke="#c98058" stroke-opacity=".75"/>
              <text x="642" y="360" text-anchor="middle" font-size="21" fill="#ffc8a4" font-family="Georgia,serif">6</text>
            </g>
            <!-- compass -->
            <g transform="translate(112,540)" stroke="#d8a94a" stroke-opacity=".55" fill="none">
              <circle r="34"/><circle r="24" stroke-opacity=".2"/>
              <path d="M0 -30 L7 0 L0 30 L-7 0 Z" fill="#d8a94a" fill-opacity=".16"/>
              <path d="M0 -30 L7 0 L0 0 Z" fill="#d8a94a" fill-opacity=".5"/>
              <text x="0" y="-42" text-anchor="middle" font-size="12" fill="#d8a94a" stroke="none" font-family="Georgia,serif">N</text>
            </g>
            <g font-size="12" fill="#7f9490" font-family="Georgia,serif">
              <text x="700" y="608">— 4 小时航程</text>
              <line x1="640" y1="602" x2="696" y2="602" stroke="#7f9490" stroke-opacity=".6"/>
              <line x1="640" y1="598" x2="640" y2="606" stroke="#7f9490" stroke-opacity=".6"/>
              <line x1="696" y1="598" x2="696" y2="606" stroke="#7f9490" stroke-opacity=".6"/>
            </g>
            <g stroke="#6fb8af" stroke-opacity=".5" stroke-dasharray="2 6">
              <path d="M620 560 C640 520 660 470 676 402"/>
            </g>
            <text x="640" y="584" font-size="11" fill="#5f7f7c" font-family="sans-serif" letter-spacing="2">潮汐线</text>
          </svg>