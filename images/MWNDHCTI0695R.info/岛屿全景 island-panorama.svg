<svg viewBox="0 46 1200 474" role="img" aria-labelledby="pvTitle pvDesc">
            <title id="pvTitle">无昼岛全景概念示意图</title>
            <desc id="pvDesc">深色海面上，一座黑色岛屿横陈于中央：左侧是搁浅的沉船与海盗船剪影，中部是滩头营地的微弱灯火与神庙残柱，右侧灯塔射出一道惨白光束；远处海面有雾墙，一艘挂着双锚灯笼的商船正在靠近。</desc>
            <defs>
              <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#0a1c22"/><stop offset="55%" stop-color="#0d2830"/><stop offset="100%" stop-color="#123239"/>
              </linearGradient>
              <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#0c2228"/><stop offset="100%" stop-color="#050c0f"/>
              </linearGradient>
              <radialGradient id="moonG" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="#f2e8c9" stop-opacity=".95"/>
                <stop offset="55%" stop-color="#d9ceae" stop-opacity=".5"/>
                <stop offset="100%" stop-color="#d9ceae" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#efe6c6" stop-opacity=".30"/>
                <stop offset="100%" stop-color="#efe6c6" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#9fb8b4" stop-opacity="0"/>
                <stop offset="50%" stop-color="#9fb8b4" stop-opacity=".20"/>
                <stop offset="100%" stop-color="#9fb8b4" stop-opacity="0"/>
              </linearGradient>
              <radialGradient id="lampG" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="#ffd98a" stop-opacity=".85"/>
                <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <rect width="1200" height="520" fill="url(#skyG)"/>
            <circle cx="905" cy="104" r="120" fill="url(#moonG)"/>
            <circle cx="905" cy="104" r="32" fill="#efe4c2" opacity=".82"/>
            <ellipse cx="300" cy="96" rx="210" ry="16" fill="#7c9a9a" opacity=".07"/>
            <ellipse cx="640" cy="140" rx="260" ry="13" fill="#7c9a9a" opacity=".06"/>
            <ellipse cx="1060" cy="70" rx="150" ry="10" fill="#7c9a9a" opacity=".05"/>
            <rect y="300" width="1200" height="220" fill="url(#seaG)"/>
            <path d="M0 300h1200" stroke="#7fb0ac" stroke-opacity=".22" stroke-width="1"/>
            <!-- distant fog wall -->
            <rect x="0" y="248" width="1200" height="96" fill="url(#fogG)"/>
            <!-- far island ridge -->
            <path d="M60 312 C150 286 208 292 258 276 C300 262 330 268 356 258 C392 244 420 258 452 250 C486 242 512 252 540 246 C596 236 640 250 690 244 C742 238 800 252 860 258 C930 266 1010 258 1140 274 L1140 320 L60 320 Z" fill="#0a1b20"/>
            <!-- main island -->
            <path d="M104 358 C146 332 188 340 224 320 C258 302 284 310 312 292 C334 278 354 286 372 272 C390 258 410 266 428 280 C444 292 462 282 480 288 C500 294 518 282 538 286 C560 290 576 300 594 296 C614 292 630 304 648 302 C674 300 698 314 722 318 C750 322 772 332 798 336 L798 358 Z" fill="#081619"/>
            <path d="M104 358 C146 332 188 340 224 320 C258 302 284 310 312 292 C334 278 354 286 372 272 C390 258 410 266 428 280 C444 292 462 282 480 288 C500 294 518 282 538 286 C560 290 576 300 594 296 C614 292 630 304 648 302 C674 300 698 314 722 318 C750 322 772 332 798 336" fill="none" stroke="#3f6b66" stroke-opacity=".5" stroke-width="1.2"/>
            <!-- caldera notch glow -->
            <path d="M470 300 C486 276 520 274 540 296 C520 292 492 292 470 300Z" fill="#2e5a58" opacity=".35"/>
            <!-- temple columns -->
            <g fill="#0c2328" stroke="#2c4a48" stroke-opacity=".5" stroke-width="1">
              <rect x="352" y="262" width="7" height="34"/><rect x="368" y="256" width="7" height="40"/>
              <rect x="384" y="262" width="7" height="34"/><rect x="400" y="250" width="7" height="46"/>
              <path d="M344 250 L412 240 L412 246 L344 256 Z"/>
            </g>
            <!-- lighthouse -->
            <g>
              <path d="M596 302 L600 214 L614 214 L618 302 Z" fill="#0d2429" stroke="#3b5b58" stroke-opacity=".55"/>
              <rect x="596" y="204" width="22" height="12" rx="2" fill="#102b2f" stroke="#3b5b58" stroke-opacity=".5"/>
              <path d="M600 204 L612 194 L624 204 Z" fill="#0d2429" stroke="#3b5b58" stroke-opacity=".45"/>
              <circle cx="607" cy="210" r="3" fill="#ffe2a0"/>
              <circle cx="607" cy="210" r="22" fill="url(#lampG)"/>
              <path d="M610 204 L1200 128 L1200 250 Z" fill="url(#beamG)"/>
              <path d="M604 208 L0 300 L0 236 Z" fill="url(#beamG)" opacity=".45"/>
            </g>
            <!-- camp tents + fire -->
            <g transform="translate(0,-16)">
              <path d="M432 330 L446 306 L460 330 Z" fill="#122b2c"/>
              <path d="M462 332 L474 312 L486 332 Z" fill="#102628"/>
              <ellipse cx="448" cy="334" rx="34" ry="9" fill="url(#lampG)"/>
              <circle cx="440" cy="332" r="2.4" fill="#ffcf7d"/>
              <circle cx="455" cy="335" r="1.8" fill="#ffbe62"/>
            </g>
            <!-- pirate ship left -->
            <g fill="#061114">
              <path d="M150 372 L286 372 L268 398 L170 398 Z"/>
              <rect x="196" y="286" width="3" height="88"/>
              <rect x="236" y="304" width="3" height="70"/>
              <path d="M199 292 C226 306 232 322 226 340 C216 330 204 330 199 336 Z" opacity=".92"/>
              <path d="M239 312 C262 320 266 338 258 354 C250 344 242 342 239 348 Z" opacity=".85"/>
              <path d="M150 372 L150 340 L160 328" stroke="#061114" stroke-width="3" fill="none"/>
              <path d="M143 366 L155 384 L167 366 Z"/>
              <circle cx="258" cy="288" r="3" fill="#c95d43" opacity=".9"/>
            </g>
            <!-- merchant ship right -->
            <g>
              <path d="M872 386 L1042 386 L1018 416 L896 416 Z" fill="#0a1a1e" stroke="#3d5a58" stroke-opacity=".4"/>
              <rect x="928" y="300" width="3" height="88" fill="#0a1a1e"/>
              <rect x="976" y="316" width="3" height="72" fill="#0a1a1e"/>
              <path d="M931 306 C958 318 964 340 958 360 L931 356 Z" fill="#1a353b" stroke="#5f8a86" stroke-opacity=".35"/>
              <path d="M979 322 C1002 332 1006 352 998 368 L979 364 Z" fill="#173037" stroke="#5f8a86" stroke-opacity=".28"/>
              <path d="M931 306 L955 306 L958 360 L931 356 Z" fill="#d8a94a" opacity=".10"/>
              <circle cx="915" cy="380" r="2.6" fill="#ffce7a"/>
              <circle cx="1002" cy="378" r="2.2" fill="#ffce7a"/>
              <circle cx="944" cy="386" r="1.8" fill="#ffce7a"/>
              <circle cx="915" cy="380" r="13" fill="url(#lampG)"/>
              <circle cx="1002" cy="378" r="11" fill="url(#lampG)"/>
            </g>
            <!-- waves -->
            <g stroke="#6fa8a2" stroke-opacity=".22" stroke-width="1" fill="none">
              <path d="M40 352 q14 -5 28 0 t28 0 t28 0"/>
              <path d="M150 380 q16 -5 32 0 t32 0 t32 0"/>
              <path d="M420 360 q14 -5 28 0 t28 0 t28 0"/>
              <path d="M680 348 q16 -5 32 0 t32 0 t32 0"/>
              <path d="M820 400 q18 -6 36 0 t36 0 t36 0"/>
              <path d="M1010 440 q18 -6 36 0 t36 0"/>
              <path d="M180 442 q16 -5 32 0 t32 0 t32 0"/>
              <path d="M620 470 q18 -6 36 0 t36 0 t36 0"/>
            </g>
            <g stroke="#d8a94a" stroke-opacity=".35" stroke-width="1" fill="none">
              <path d="M760 432 q10 -4 20 0 t20 0"/>
              <path d="M540 424 q10 -4 20 0 t20 0"/>
            </g>
            <!-- foreground rocks -->
            <path d="M0 520 L0 470 C40 452 78 466 108 486 C132 502 150 512 168 520 Z" fill="#040a0c"/>
            <path d="M1200 520 L1200 462 C1160 452 1124 470 1098 488 C1076 502 1056 512 1040 520 Z" fill="#040a0c"/>
            <!-- gulls -->
            <g stroke="#c9d6cf" stroke-opacity=".45" stroke-width="1.2" fill="none">
              <path d="M736 160 q6 -6 12 0 q6 -6 12 0"/>
              <path d="M790 132 q5 -5 10 0 q5 -5 10 0"/>
            </g>
          </svg>